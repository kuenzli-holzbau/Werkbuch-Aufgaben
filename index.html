<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Werkbuch Aufgaben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: eine Spalte, mobil zuerst; "Jetzt" als Startseite, Bereichs-Kacheln, kompakte Liste für den PC. Navigation unten (mobil) bzw. oben (PC). */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --surface2:#F5F7F5; --ink:#17211D; --muted:#5B6862; --line:#D3DBD6;
  --accent:#1D6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --late:#B4381F; --late-soft:#F7E1DA; --today:#9A6A00; --today-soft:#F6ECD2; --work:#B85C00; --work-soft:#FDEBD5; --work-line:#F2C38E;
  --shadow:0 1px 2px rgba(20,35,30,.08),0 4px 14px rgba(20,35,30,.06);
  --f-display:"Archivo",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1A2320; --surface2:#151D1A; --ink:#E6ECE9; --muted:#97A59E; --line:#2C3833;
  --accent:#4FB394; --accent-ink:#0D1A15; --accent-soft:#1E3A31;
  --late:#F08A6E; --late-soft:#3A2019; --today:#E2B44A; --today-soft:#352B12; --work:#F5A55A; --work-soft:#3A2814; --work-line:#6B4520;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A2320; --surface2:#151D1A; --ink:#E6ECE9; --muted:#97A59E; --line:#2C3833;
  --accent:#4FB394; --accent-ink:#0D1A15; --accent-soft:#1E3A31;
  --late:#F08A6E; --late-soft:#3A2019; --today:#E2B44A; --today-soft:#352B12; --work:#F5A55A; --work-soft:#3A2814; --work-line:#6B4520;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em;text-transform:uppercase}
.brand small{font-family:var(--f-body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:6px;font-size:.85rem}
.sync{font-size:.8rem;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1.1;margin:4px 0 2px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:8px 12px;font-size:.85rem;margin-bottom:6px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;width:100%;max-width:860px}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.22);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
@media (min-width:900px){
  nav.tabs{position:fixed;top:0;padding-top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs button{flex-direction:row;justify-content:center;padding:14px 8px;font-size:.9rem;gap:8px}
  .wrap{padding-block:72px 60px}
  .fab{bottom:28px;right:28px}
}
/* task rows */
.list{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);border-left:5px solid var(--ac,var(--line))}
.task .body{min-width:0;cursor:pointer}
.task .t{font-weight:700;overflow-wrap:anywhere}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.8rem;color:var(--muted);margin-top:2px;align-items:center}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);display:grid;place-items:center;padding:0}
.chk:hover{border-color:var(--accent)}
.chk svg{width:16px;height:16px;opacity:0}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk.on svg{opacity:1}
.due{font-family:var(--f-mono);font-size:.78rem;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.due.late{background:var(--late-soft);color:var(--late)}
.due.today{background:var(--today-soft);color:var(--today)}
.area-tag{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ac,var(--muted));flex:none}
.ic{display:inline-flex;align-items:center;gap:3px}
.ic svg{width:14px;height:14px}
.ex{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.prio{font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.prio.p1{background:var(--late);color:var(--surface)}
.prio.p3{border:1px solid var(--line);color:var(--muted)}
.task.p3 .t{font-weight:400;color:var(--muted)}
.hidden-note{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.88rem;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.plan{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.plan .time{width:84px;padding:6px 6px;font-family:var(--f-mono);font-size:.85rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px}
.plan .mv{display:flex;flex-direction:column;gap:2px}
.plan .mv button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;width:30px;height:24px;padding:0;line-height:1;color:var(--muted)}
.plan .task{box-shadow:var(--shadow)}
.task.isdone .t{text-decoration:line-through;color:var(--muted)}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}
.tagp{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.sugbtn{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:6px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.plan .mv .olk{display:grid;place-items:center;width:30px;height:24px;border-radius:6px;background:#0F6CBD;color:#fff;font-size:.65rem;font-weight:800;text-decoration:none}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.thumb{position:relative;width:46px;height:46px;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pc{position:absolute;right:2px;top:2px;background:#E1251B;color:#fff;font-size:.62rem;font-weight:800;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px}
.sc{display:inline-flex;align-items:center;gap:5px;height:30px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:0 9px;font-size:.8rem;font-weight:700;color:var(--ink)}
.sc svg{width:14px;height:14px}
.sc.pdf{color:var(--late)}
.sc .fn{font-weight:400;color:var(--muted);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{background:none;border:0;padding:4px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.sync:hover{background:var(--surface2)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sdot,var(--muted))}
.sync[data-s="ok"]{--sdot:var(--accent)} .sync[data-s="sync"]{--sdot:var(--today)} .sync[data-s="offline"]{--sdot:var(--muted)} .sync[data-s="error"]{--sdot:var(--late);color:var(--late)}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:16px}
.loginbox{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:22px 20px;width:100%;max-width:380px}
.thumb img:not([src]){visibility:hidden}
.plan .mv .olk.ok{background:var(--accent-soft);color:var(--accent)} .plan .mv .olk.wait{background:var(--surface2);color:var(--muted)}
.plan .mv .olk svg{width:14px;height:14px}
.plan .time.ro{display:block;width:84px;text-align:center;font-size:.8rem;color:#0F6CBD;background:none;border:1px dashed var(--line);padding:7px 4px;border-radius:8px}
.task.calev{--ac:#0F6CBD;background:var(--surface2);box-shadow:none;grid-template-columns:1fr}
.olbadge{display:inline-flex;align-items:center;gap:3px;color:#0F6CBD;font-weight:700}
.olbadge svg{width:12px;height:12px}
.msbox{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.task .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.whotag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px 2px 3px;font-size:.8rem;font-weight:700;color:var(--ink);white-space:nowrap;max-width:11em;overflow:hidden;text-overflow:ellipsis}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#5B4BB7;color:#fff;font-size:.62rem;font-weight:800;letter-spacing:0;flex:none}
.chip.who{padding:4px 11px 4px 4px}
.chip.who[aria-pressed="true"] .av{background:var(--accent-ink);color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.task.wip{background:var(--work-soft);box-shadow:0 0 0 1px var(--work-line),var(--shadow)}
.task.wip .chk{border-color:var(--work);background:var(--surface)}
.wiptag{font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--work);color:var(--surface)}
.compact .task.wip{box-shadow:none}
.ctx{position:fixed;z-index:90;min-width:220px;max-width:min(320px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;font-size:.92rem}
.ctx .ctxh{font-weight:700;padding:6px 10px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--line);margin-bottom:4px}
.ctx .ctxl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 2px}
.ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px}
.ctx button:hover,.ctx button:focus-visible{background:var(--surface2);outline:none}
.ctx .ck{width:14px;color:var(--accent);font-weight:800}
.ctx .sw-w{width:10px;height:10px;border-radius:3px;background:var(--work-soft);border:1px solid var(--work)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pill.wip{background:var(--work-soft);color:var(--work);border:0;cursor:pointer}
.empty{color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.pill{font-size:.85rem;font-weight:700;border-radius:999px;padding:4px 11px;background:var(--surface);box-shadow:var(--shadow)}
.pill.late{color:var(--late)} .pill.today{color:var(--today)}
.inbox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-top:14px;border:0;width:100%;text-align:left}
.inbox b{font-family:var(--f-display)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;border:0;text-align:left;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--ac);min-width:0}
.tile .kind{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .name{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1.2;overflow-wrap:anywhere}
.counts{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.counts span{padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.counts .late{background:var(--late-soft);color:var(--late);font-weight:700}
.counts .soon{background:var(--today-soft);color:var(--today);font-weight:700}
.counts .calm{background:var(--accent-soft);color:var(--accent);font-weight:700}
/* buttons, inputs */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--late)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .dot{background:var(--accent-ink)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
details.fold{margin-top:14px}
details.fold summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.9rem;padding:6px 0}
.compact .task{padding:6px 10px;box-shadow:none;border-radius:6px;border-bottom:1px solid var(--line)}
.compact .chk{width:24px;height:24px}
.compact .list{gap:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.toolbar input[type=search]{flex:1 1 200px;width:auto}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{font-family:var(--f-display);font-size:1.25rem;margin:0 0 12px}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.att{position:relative;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);aspect-ratio:1;max-width:100%;padding:0}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .lab{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.68rem;border-radius:4px;padding:1px 5px}
.att.file{display:grid;place-items:center;font-size:.8rem;color:var(--muted);text-align:center;padding:6px}
.pinlist{font-size:.85rem;margin:0 0 12px;padding-left:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:.9rem;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700}
@media (min-width:900px){.toast{bottom:40px}}
/* annotator */
.anno{position:fixed;inset:0;z-index:50;background:#0E1311;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.anno .bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;align-items:center;background:#18201D}
.anno .bar .btn{background:#26302C;border-color:#34413B;color:#E6ECE9;padding:7px 11px}
.anno .bar .btn[aria-pressed="true"]{background:#4FB394;color:#0D1A15;border-color:#4FB394}
.anno .bar .btn.pri{background:#4FB394;color:#0D1A15}
.anno .stage{flex:1;overflow:auto;display:grid;place-items:center;padding:10px;min-height:0}
.anno canvas{max-width:100%;max-height:100%;touch-action:none;background:#fff}
.anno .pinbox{background:#18201D;padding:8px 10px;display:flex;gap:6px}
.anno .pinbox input{background:#26302C;color:#E6ECE9;border-color:#34413B}
.anno .swatches{display:flex;gap:5px;align-items:center;padding:0 4px}
.anno .sw{width:26px;height:26px;border-radius:50%;background:var(--sc);border:2px solid #34413B;padding:0}
.anno .sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #4FB394}
.anno .hint{color:#97A59E;font-size:.8rem;margin-left:auto}
/* meeting */
.out{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-top:12px}
.out ul{margin:6px 0 0;padding-left:20px}
.sug{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.sug .row select,.sug .row input{width:auto;padding:6px 8px;font-size:.85rem}
.meet{background:var(--surface);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
.meet summary{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="loginbox" id="loginform" autocomplete="on">
    <div class="brand">Werkbuch <small>Aufgaben</small></div>
    <h1 style="font-size:1.5rem;margin:6px 0 14px">Anmelden</h1>

<script>
(() => {
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,16);
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysUntil = s => Math.round((parse(s) - parse(today())) / 864e5);
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const fmt = s => { const d = parse(s); return `${WD[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}.`; };
function dueLabel(s){
  if(!s) return "";
  const n = daysUntil(s);
  if(n < -1) return `${-n} Tage überfällig`;
  if(n === -1) return "seit gestern";
  if(n === 0) return "heute";
  if(n === 1) return "morgen";
  return fmt(s);
}
function addPeriod(s, unit, n){
  const d = parse(s);
  if(unit === "w") d.setDate(d.getDate() + 7*n);
  else if(unit === "m"){ const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  else if(unit === "y") d.setFullYear(d.getFullYear()+n);
  return iso(d);
}
function parseTime(v){ const m = String(v || "").trim().match(/^(\d{1,2})(?:[:.]?(\d{2}))?$/); if(!m || +m[1] > 23 || +(m[2] || 0) > 59) return null; return pad(+m[1]) + ":" + (m[2] || "00"); }
// "0800 Text" oder "0800-0930 Text"
function leadingTime(txt){
  const m = String(txt).match(/^(\d{1,2})[:.]?(\d{2})(?:\s*-\s*(\d{1,2})[:.]?(\d{2}))?\s+(.+)$/);
  if(m && +m[1] < 24 && +m[2] < 60){
    const time = pad(+m[1]) + ":" + m[2];
    let end = m[3] !== undefined && +m[3] < 24 && +m[4] < 60 ? pad(+m[3]) + ":" + m[4] : null;
    if(end && end <= time) end = null;
    return { time, end, rest: m[5].trim() };
  }
  return { time: null, end: null, rest: String(txt).trim() };
}
function parseRange(v){ // "0800", "800", "0800-0930"
  const p = String(v || "").trim().split(/\s*-\s*/);
  const time = parseTime(p[0]); if(!time || p.length > 2) return null;
  let end = p[1] ? parseTime(p[1]) : null; if(p[1] && !end) return null; if(end && end <= time) end = null;
  return { time, end };
}
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fromMin = n => { n = Math.max(0, Math.min(23 * 60 + 59, n)); return pad(Math.floor(n / 60)) + ":" + pad(n % 60); };
// Schnelleingabe: "! 1200 Mittag" = hohe Priorität, 12:00 Uhr, Titel "Mittag"
function parseQuick(txt){
  let t = String(txt || "").trim(), high = false;
  const m = t.match(/^!+\s*(.*)$/); if(m){ high = true; t = m[1]; }
  let who = null; // "@Tobi" irgendwo im Text = an Tobi delegiert
  t = t.replace(/(^|\s)@([\p{L}][\p{L}\p{N}_.-]*)/u, (all, sp, name) => { who = name.replace(/_/g, " "); return sp; }).replace(/\s+/g, " ").trim();
  const { time, end, rest } = leadingTime(t);
  return { high, time, end, who, rest: (rest || t).trim() };
}
const UNIT = {w:["Woche","Wochen"], m:["Monat","Monate"], y:["Jahr","Jahre"]};
const recLabel = r => r ? `alle ${r.n>1? r.n+" "+UNIT[r.unit][1] : UNIT[r.unit][0]} · ${r.lead} T vorher` : "";
const KIND = {baustelle:"Baustelle", produktion:"Produktion", intern:"Intern", lehrlinge:"Lehrlinge", sicherheit:"Sicherheit", eingang:"Eingang"};
const PALETTE = ["#2F6FB0","#B5651D","#7A55B8","#2E8B6A","#C23B55","#C08A00","#3D8FA6","#8A6A3D"];
const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 0 0 4-4v-1"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7-7L13 4.5a3.3 3.3 0 0 1 4.7 4.7L9.5 17.4a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6"/></svg>'
};

/* ---------- state ---------- */
const S = { areas: [], tasks: [], meetings: [], tab: "jetzt", area: null, listArea: "alle", q: "", live: false, showLow: false, day: null };
const FOCUS_LIMIT = 5; // ab so vielen hohen Prioritäten in "Jetzt" werden niedrige ausgeblendet
const prio = t => t.prio || 2;
const PRIO = { 1: "Hoch", 2: "Normal", 3: "Niedrig" };
// Delegieren: Mitarbeitende werden aus den bisherigen Zuweisungen vorgeschlagen (häufigste zuerst)
const cleanWho = v => String(v || "").replace(/\s+/g, " ").trim().slice(0, 40);
function people(){
  const n = new Map();
  for(const t of S.tasks) if(t.who){ const k = t.who.toLowerCase(); const e = n.get(k) || { name: t.who, c: 0, open: 0 }; e.c++; if(!t.done) e.open++; n.set(k, e); }
  for(const name of S.peopleList || []){ const k = name.toLowerCase(); if(!n.has(k)) n.set(k, { name, c: 0, open: 0, saved: true }); else n.get(k).saved = true; }
  return [...n.values()].sort((a, b) => b.c - a.c || a.name.localeCompare(b.name));
}
// Erwähnung eines Namens im Titel oder in der Notiz (Wortanfang, Gross/klein egal, "Tobis" zählt auch)
const mentionRe = new Map();
function mentions(t, name){
  if((t.who || "").toLowerCase() === name.toLowerCase()) return true;
  let re = mentionRe.get(name);
  if(!re){ re = new RegExp("(^|[^\\p{L}\\p{N}])@?" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "iu"); mentionRe.set(name, re); }
  return re.test((t.title || "") + "\n" + (t.note || ""));
}
const personTasks = name => openTasks().filter(t => !isHiddenRec(t) && mentions(t, name));
// gespeicherte Personenliste: liegt als besonderer Eintrag "__people" in der Tabelle der Bereiche
async function savePeople(list){
  S.peopleList = [...new Set(list.map(cleanWho).filter(Boolean))];
  try {
    await idbPut("docs", "areas/__people", { col: "areas", id: "__people", data: { names: S.peopleList }, deleted: false });
    await idbPut("outbox", "areas/__people", Date.now() + Math.random());
  } catch(e){}
  kick(); render();
}
function canonWho(v){ v = cleanWho(v); if(!v) return null; const hit = people().find(p => p.name.toLowerCase() === v.toLowerCase()); return hit ? hit.name : v; }
const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
let sb = null; // Supabase-Client
const BUCKET = "anhaenge", COLS = ["areas", "tasks", "meetings"], APP_VERSION = "V5";
const areaById = id => S.areas.find(a => a.id === id);
const color = a => a ? a.color : "var(--muted)";
const openTasks = () => S.tasks.filter(t => !t.done);
function isVisibleNow(t){
  if(t.done || !t.due) return false;
  const n = daysUntil(t.due);
  return t.rec ? n <= (t.rec.lead ?? 5) : n <= 7;
}
function isHiddenRec(t){ return !t.done && t.rec && t.due && daysUntil(t.due) > (t.rec.lead ?? 5); }
const byDue = (a,b) => (a.due||"9999") < (b.due||"9999") ? -1 : (a.due||"9999") > (b.due||"9999") ? 1 : (prio(a) - prio(b)) || (a.title||"").localeCompare(b.title||"");
const byPrio = (a,b) => (prio(a) - prio(b)) || byDue(a,b);

/* ---------- lokale Ablage (IndexedDB) ---------- */
// Alles wird zuerst lokal gespeichert und dann im Hintergrund mit Supabase abgeglichen. So geht die App auch offline.
let idbP = null;
function idbOpen(){
  return idbP || (idbP = new Promise((res, rej) => {
    const r = indexedDB.open("werkbuch", 1);
    r.onupgradeneeded = () => { const d = r.result; ["docs", "outbox", "blobs", "meta"].forEach(n => { if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function idb(store, mode, fn){
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const st = t.objectStore(store); let out;
    const rq = fn(st); if(rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const idbGet = (st, k) => idb(st, "readonly", s => s.get(k));
const idbPut = (st, k, v) => idb(st, "readwrite", s => s.put(v, k));
const idbDel = (st, k) => idb(st, "readwrite", s => s.delete(k));
const idbKeys = st => idb(st, "readonly", s => s.getAllKeys());
const idbVals = st => idb(st, "readonly", s => s.getAll());
const idbClear = st => idb(st, "readwrite", s => s.clear());

let renderT = null;
function scheduleRender(){ clearTimeout(renderT); renderT = setTimeout(render, 30); }
const sortMeetings = () => S.meetings.sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.created || "").localeCompare(a.created || ""));

async function loadLocal(){
  const rows = await idbVals("docs");
  for(const c of COLS) S[c] = rows.filter(r => r.col === c && !r.deleted && r.id !== "__people").map(r => ({ id: r.id, ...r.data }));
  const pl = rows.find(r => r.col === "areas" && r.id === "__people" && !r.deleted);
  S.peopleList = pl && Array.isArray(pl.data.names) ? pl.data.names : [];
  sortMeetings();
}
async function saveDoc(col, obj){
  const { id, ...data } = obj;
  const i = S[col].findIndex(x => x.id === id);
  if(i >= 0) S[col][i] = obj; else S[col].push(obj);
  if(col === "meetings") sortMeetings();
  render();
  try {
    await idbPut("docs", col + "/" + id, { col, id, data: JSON.parse(JSON.stringify(data)), deleted: false });
    await idbPut("outbox", col + "/" + id, Date.now() + Math.random());
  } catch(e){ toast("Lokales Speichern fehlgeschlagen. Ist der Speicher des Geräts voll?"); return false; }
  kick(); if(col === "tasks") msKick();
  return true;
}
async function deleteDoc(col, id){
  S[col] = S[col].filter(x => x.id !== id); render();
  const old = await idbGet("docs", col + "/" + id);
  await idbPut("docs", col + "/" + id, { col, id, data: old ? old.data : {}, deleted: true });
  await idbPut("outbox", col + "/" + id, Date.now() + Math.random());
  kick();
}
const putTask = t => saveDoc("tasks", t);
async function dropTask(id){
  const t = S.tasks.find(x => x.id === id);
  if(t && t.ol && t.ol.id && MS.tok){ const d = (await idbGet("meta", "msdel").catch(() => null)) || []; d.push(t.ol.id); await idbPut("meta", "msdel", d); msKick(); }
  return deleteDoc("tasks", id);
}
const putArea = a => saveDoc("areas", a);
const putMeeting = m => saveDoc("meetings", m);

/* ---------- Anhänge ---------- */
// Dateien liegen lokal (sofort sichtbar, auch offline) und werden beim nächsten Abgleich in den privaten Supabase-Speicher hochgeladen.
const urlCache = new Map();
async function storeBlob(blob, ext){
  const path = `${S.user.id}/${uid()}.${ext}`;
  await idbPut("blobs", path, { blob, uploaded: false });
  urlCache.set(path, URL.createObjectURL(blob));
  kick();
  return path;
}
async function getBlob(path){
  const rec = await idbGet("blobs", path);
  if(rec && rec.blob) return rec.blob;
  if(!sb || !navigator.onLine) throw new Error("offline");
  const { data, error } = await sb.storage.from(BUCKET).download(path);
  if(error) throw error;
  try { await idbPut("blobs", path, { blob: data, uploaded: true }); } catch(e){}
  return data;
}
async function blobURL(path){
  if(!path) return "";
  if(urlCache.has(path)) return urlCache.get(path);
  const u = URL.createObjectURL(await getBlob(path));
  urlCache.set(path, u); return u;
}
const imgPath = a => a.annot || a.preview || (a.kind !== "pdf" ? a.file : null);
const imgTag = (path, attrs = "") => `<img data-path="${esc(path)}" ${urlCache.has(path) ? `src="${esc(urlCache.get(path))}" data-done="1"` : ""} ${attrs}>`;
function hydrate(root = document){
  root.querySelectorAll("img[data-path]:not([data-done])").forEach(async img => {
    img.dataset.done = "1";
    try { img.src = await blobURL(img.dataset.path); } catch(e){ img.alt = "Nicht verfügbar"; img.title = "Bild ist erst nach dem nächsten Abgleich verfügbar"; }
  });
}
async function openFile(path){
  const w = window.open("", "_blank");
  try { const u = await blobURL(path); if(w) w.location.href = u; else location.href = u; }
  catch(e){ if(w) w.close(); toast("Datei ist offline nicht verfügbar."); }
}

/* ---------- Outlook (Microsoft 365) ---------- */
// Anmeldung direkt bei Microsoft (Code-Flow mit PKCE), danach Microsoft Graph für den Kalender.
// Die Verbindung gilt pro Gerät; die Zuordnung Aufgabe -> Termin (t.ol) wird mit den Aufgaben abgeglichen.
const MS = { tok: null, cal: [], err: "", need: false, last: 0, busy: false };
const MS_SCOPES = "openid profile offline_access User.Read Calendars.ReadWrite";
const TZ = "W. Europe Standard Time", WB_CAT = "Werkbuch";
function msCfg(){ const c = window.WERKBUCH_CONFIG || {}; return c.msClientId ? { client: c.msClientId, tenant: c.msTenant || "organizations" } : null; }
const msRedirect = () => location.origin + location.pathname.replace(/index\.html$/, "");
function msLoad(){ try { MS.tok = JSON.parse(localStorage.getItem("wb_ms") || "null"); } catch(e){ MS.tok = null; } }
function msSave(){ try { if(MS.tok) localStorage.setItem("wb_ms", JSON.stringify(MS.tok)); else localStorage.removeItem("wb_ms"); } catch(e){} }
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const jwt = s => { try { const p = s.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(decodeURIComponent(escape(atob(p + "===".slice((p.length + 3) % 4))))); } catch(e){ return {}; } };
function msErrText(e){
  const m = String((e && (e.message || e.code)) || e);
  if(/AADSTS65001|consent/i.test(m)) return "Die Zustimmung für den Kalenderzugriff fehlt. Eure IT muss die App freigeben (Administratorzustimmung).";
  if(/AADSTS90094|AADSTS90008|admin/i.test(m)) return "Eure Firma verlangt eine Freigabe durch einen Administrator.";
  if(/AADSTS50011|redirect/i.test(m)) return "Die Rücksprungadresse in der App-Registrierung stimmt nicht.";
  if(/AADSTS700016|AADSTS700054|not found in the directory/i.test(m)) return "Die Client-ID oder Tenant-ID stimmt nicht.";
  if(/AADSTS9002326|cross-origin|Single-Page/i.test(m)) return "In der App-Registrierung muss die Plattform „Single-page application“ sein.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Keine Verbindung zu Microsoft.";
  return m.slice(0, 200);
}
async function msConnect(){
  const c = msCfg(); if(!c){ toast("Outlook ist noch nicht eingerichtet."); return; }
  if(!navigator.onLine){ toast("Zum Verbinden braucht es Internet."); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  try { localStorage.setItem("wb_ms_pkce", JSON.stringify({ verifier, state, back: S.tab })); } catch(e){}
  const p = new URLSearchParams({ client_id: c.client, response_type: "code", redirect_uri: msRedirect(), response_mode: "query", scope: MS_SCOPES, state, code_challenge: challenge, code_challenge_method: "S256" });
  if(MS.tok && MS.tok.user) p.set("login_hint", MS.tok.user); else p.set("prompt", "select_account");
  location.href = `https://login.microsoftonline.com/${encodeURIComponent(c.tenant)}/oauth2/v2.0/authorize?${p}`;
}
function msDisconnect(){ MS.tok = null; MS.cal = []; MS.need = false; MS.err = ""; msSave(); idbDel("meta", "mscal").catch(() => {}); render(); toast("Outlook getrennt. Bestehende Termine bleiben im Kalender."); }
async function msTokenRequest(params){
  const c = msCfg();
  const r = await fetch(`https://login.microsoftonline.com/${encodeURIComponent(c.tenant)}/oauth2/v2.0/token`, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: c.client, scope: MS_SCOPES, ...params }) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(j.error_description || j.error || ("HTTP " + r.status)), { code: j.error, status: r.status });
  return j;
}
function msStore(j){
  const id = jwt(j.id_token || "");
  MS.tok = { access: j.access_token, exp: Date.now() + ((j.expires_in || 3600) - 120) * 1000, refresh: j.refresh_token || (MS.tok && MS.tok.refresh) || null,
    user: id.preferred_username || id.email || (MS.tok && MS.tok.user) || "", name: id.name || (MS.tok && MS.tok.name) || "" };
  MS.need = false; msSave();
}
async function msHandleRedirect(){
  const q = new URLSearchParams(location.search);
  if(!q.has("code") && !q.has("error")) return;
  let pk = null; try { pk = JSON.parse(localStorage.getItem("wb_ms_pkce") || "null"); localStorage.removeItem("wb_ms_pkce"); } catch(e){}
  history.replaceState(null, "", msRedirect());
  if(!pk) return; // nicht von uns
  if(pk.back) S.tab = pk.back;
  if(q.get("error")){ MS.err = msErrText(q.get("error_description") || q.get("error")); S.msToast = "Outlook-Verbindung fehlgeschlagen."; return; }
  if(pk.state !== q.get("state")){ MS.err = "Die Anmeldung ist abgelaufen. Bitte nochmals verbinden."; return; }
  try {
    msStore(await msTokenRequest({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: msRedirect(), code_verifier: pk.verifier }));
    MS.err = ""; S.msToast = "Outlook verbunden" + (MS.tok.user ? " mit " + MS.tok.user : "") + ".";
  } catch(e){ MS.err = msErrText(e); S.msToast = "Outlook-Verbindung fehlgeschlagen."; }
}
async function msToken(force){

  try { msStore(await msTokenRequest({ grant_type: "refresh_token", refresh_token: MS.tok.refresh })); return MS.tok.access; }
  catch(e){ if(e.status === 400 || e.status === 401){ MS.tok.refresh = null; MS.tok.access = null; MS.need = true; msSave(); return null; } throw e; }
}
async function graph(method, path, body, retried){

  const r = await fetch(path.startsWith("http") ? path : "https://graph.microsoft.com/v1.0" + path, { method,
    headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json", Prefer: `outlook.timezone="${TZ}"` }, body: body ? JSON.stringify(body) : undefined });
  if(r.status === 401 && !retried){ MS.tok.exp = 0; return graph(method, path, body, true); }
  if(r.status === 204) return null;
  const j = await r.json().catch(() => null);
  if(!r.ok) throw Object.assign(new Error((j && j.error && j.error.message) || ("HTTP " + r.status)), { status: r.status, code: j && j.error && j.error.code });

const wantsEvent = t => !t.done && !!t.plan && /^\d\d:\d\d$/.test(t.planTime || "");
const evEnd = t => t.planEnd && t.planEnd > t.planTime ? t.planEnd : fromMin(toMin(t.planTime) + 60);
const evSig = t => [t.title, t.plan, t.planTime, evEnd(t), prio(t), t.area || "", t.note || ""].join("|");
function evPayload(t){
  const a = areaById(t.area);
  return { subject: t.title,
    start: { dateTime: `${t.plan}T${t.planTime}:00`, timeZone: TZ }, end: { dateTime: `${t.plan}T${evEnd(t)}:00`, timeZone: TZ },
    body: { contentType: "text", content: `${a ? "Bereich: " + a.name + "\n" : ""}${t.note ? "\n" + t.note + "\n" : ""}\nAus Werkbuch Aufgaben: ${msRedirect()}` },
    importance: prio(t) === 1 ? "high" : "normal", categories: [WB_CAT], showAs: "busy", isReminderOn: true, reminderMinutesBeforeStart: 15 };
}
const curTask = id => S.tasks.find(x => x.id === id);
let msRunning = false, msAgain = false, msT = null;
function msKick(d = 1500){ if(!MS.tok || !msCfg()) return; clearTimeout(msT); msT = setTimeout(msSync, d); }
async function msSync(){
  if(!MS.tok || !msCfg() || !S.user) return;
  if(!navigator.onLine) return;
  if(msRunning){ msAgain = true; return; }
  msRunning = true; MS.busy = true;
  try {
    // 1. Termine gelöschter Aufgaben entfernen
    const dels = (await idbGet("meta", "msdel").catch(() => null)) || [];
    while(dels.length){
      try { await graph("DELETE", "/me/events/" + encodeURIComponent(dels[0])); } catch(e){ if(e.status !== 404) throw e; }
      dels.shift(); await idbPut("meta", "msdel", dels);
    }
    // 2. Tagesplan-Einträge mit Uhrzeit -> Outlook
    for(const t0 of [...S.tasks]){
      const t = curTask(t0.id); if(!t) continue;
      const ol = t.ol || null;
      if(wantsEvent(t)){
        const sig = evSig(t);
        if(!ol || (!ol.id && ol.sig !== sig)){ // neu (oder nach Löschen in Outlook wieder geändert)
          const gen = ol ? (ol.gen || 0) + 1 : 0;
          const ev = await graph("POST", "/me/events", { ...evPayload(t), transactionId: `wb-${t.id}-${gen}` });
          const c = curTask(t.id); if(c) await putTask({ ...c, ol: { id: ev.id, sig, gen } });
        } else if(ol.id && ol.sig !== sig){
          try { await graph("PATCH", "/me/events/" + encodeURIComponent(ol.id), evPayload(t)); const c = curTask(t.id); if(c) await putTask({ ...c, ol: { ...ol, sig } }); }
          catch(e){ if(e.status === 404){ const c = curTask(t.id); if(c) await putTask({ ...c, ol: { gen: ol.gen || 0, sig } }); } else throw e; } // in Outlook gelöscht: nicht neu anlegen
        }
      } else if(ol && ol.id && !t.done){ // aus dem Plan genommen oder Uhrzeit entfernt
        try { await graph("DELETE", "/me/events/" + encodeURIComponent(ol.id)); } catch(e){ if(e.status !== 404) throw e; }
        const c = curTask(t.id); if(c) await putTask({ ...c, ol: null });
      }
    }
    // 3. Kalender lesen (gestern bis in 3 Wochen)
    const p0 = parse(addDays(today(), -1)), p1 = parse(addDays(today(), 22));
    let url = `/me/calendarView?startDateTime=${encodeURIComponent(p0.toISOString())}&endDateTime=${encodeURIComponent(p1.toISOString())}&$select=id,subject,start,end,isAllDay,location,categories,isCancelled,createdDateTime,showAs&$orderby=start/dateTime&$top=200`;
    const all = [];
    for(let n = 0; url && n < 10; n++){ const j = await graph("GET", url); all.push(...(j.value || [])); url = j["@odata.nextLink"] || null; }
    MS.cal = all.filter(e => !e.isCancelled).map(e => ({ id: e.id, subject: e.subject || "(ohne Titel)", start: e.start.dateTime.slice(0, 16), end: e.end.dateTime.slice(0, 16),
      allDay: !!e.isAllDay, loc: (e.location && e.location.displayName) || "", wb: (e.categories || []).includes(WB_CAT), created: e.createdDateTime || "", free: e.showAs === "free" }));
    try { await idbPut("meta", "mscal", { at: Date.now(), cal: MS.cal }); } catch(e){}
    // 4. In Outlook verschobene Werkbuch-Termine übernehmen; verwaiste Termine entfernen
    const outboxEmpty = !(await idbKeys("outbox")).length;
    for(const e of MS.cal.filter(e => e.wb)){
      const t = S.tasks.find(x => x.ol && x.ol.id === e.id);
      if(!t){
        const old = e.created && Date.now() - new Date(e.created).getTime() > 15 * 60000;
        if(old && outboxEmpty && lastSync && S.status === "ok"){ try { await graph("DELETE", "/me/events/" + encodeURIComponent(e.id)); } catch(_){} MS.cal = MS.cal.filter(x => x.id !== e.id); }
        continue;
      }
      if(t.done || evSig(t) !== t.ol.sig) continue; // lokale Änderung hat Vorrang
      const day = e.start.slice(0, 10), st = e.start.slice(11, 16), en = e.end.slice(0, 10) === day ? e.end.slice(11, 16) : null;
      if(day !== t.plan || st !== t.planTime || (en && en !== evEnd(t))){
        const nt = { ...t, plan: day, planTime: st, planEnd: en, due: t.due === t.plan ? day : t.due };
        nt.ol = { ...t.ol, sig: evSig(nt) };
        await putTask(nt);
      }
    }
    MS.last = Date.now(); MS.err = "";
  } catch(e){
    if(e.code === "need") MS.need = true;
    else { MS.err = msErrText(e); console.warn("Outlook:", e); msT = setTimeout(msSync, 60000); }
  } finally {
    msRunning = false; MS.busy = false;
    if(!document.querySelector(".sheet, #anno, #viewer")) scheduleRender();
    if(msAgain){ msAgain = false; msKick(500); }
  }
}
function calOfDay(day){
  return MS.cal.filter(e => !e.wb && (e.allDay ? e.start.slice(0, 10) <= day && day < e.end.slice(0, 10) : e.start.slice(0, 10) === day))
    .sort((a, b) => (b.allDay - a.allDay) || a.start.localeCompare(b.start));

/* ---------- Abgleich mit Supabase ---------- */
let syncing = false, syncAgain = false, kickT = null, lastSync = 0, syncErr = "";
function kick(delay = 400){ clearTimeout(kickT); kickT = setTimeout(sync, delay); }
function setStatus(st, msg){
  S.status = st; syncErr = msg || "";
  const el = $("#sync"); if(!el) return;
  el.dataset.s = st;
  el.textContent = st === "ok" ? "Synchronisiert" : st === "sync" ? "Gleicht ab …" : st === "offline" ? "Offline, wird später abgeglichen" : st === "error" ? "Abgleich gestört" : "Lädt …";
}
const isNetErr = e => !navigator.onLine || /fetch|network|Load failed|timeout|503|504|PGRST003/i.test(String(e && (e.message || e.code || e)));
async function sync(){
  if(!sb || !S.user) return;
  if(syncing){ syncAgain = true; return; }
  if(!navigator.onLine){ setStatus("offline"); return; }
  syncing = true; setStatus("sync");
  try {
    // 1. neue Dateien hochladen
    const bkeys = await idbKeys("blobs");
    for(const path of bkeys){
      const rec = await idbGet("blobs", path); if(!rec || rec.uploaded) continue;
      const { error } = await sb.storage.from(BUCKET).upload(path, rec.blob, { upsert: true, contentType: rec.blob.type || undefined });
      if(error) throw error;
      rec.uploaded = true; await idbPut("blobs", path, rec);
    }
    // 2. lokale Änderungen hochladen
    const keys = await idbKeys("outbox");
    for(const k of keys){
      const stamp = await idbGet("outbox", k);
      const doc = await idbGet("docs", k);
      if(!doc){ await idbDel("outbox", k); continue; }
      const { error } = await sb.from(doc.col).upsert({ id: doc.id, data: doc.data, deleted: !!doc.deleted });
      if(error) throw error;
      if((await idbGet("outbox", k)) === stamp) await idbDel("outbox", k); // nur wenn inzwischen nicht erneut geändert
    }
    // 3. Änderungen anderer Geräte holen
    for(const col of COLS){
      const cur = await idbGet("meta", "cursor:" + col);
      let q = sb.from(col).select("id,data,deleted,updated_at").order("updated_at", { ascending: true }).limit(1000);
      if(cur) q = q.gt("updated_at", new Date(new Date(cur).getTime() - 5000).toISOString());
      const { data, error } = await q;
      if(error) throw error;
      let max = cur || "";
      for(const r of data){ await applyRemote(col, r); if(r.updated_at > max) max = r.updated_at; }
      if(max) await idbPut("meta", "cursor:" + col, max);
      if(data.length === 1000) syncAgain = true;
    }
    lastSync = Date.now();
    setStatus((await idbKeys("outbox")).length ? "sync" : "ok");
  } catch(e){
    console.warn("Abgleich:", e);
    setStatus(isNetErr(e) ? "offline" : "error", String(e && (e.message || e)));
    if(!syncAgain) kick(30000);
  } finally {
    syncing = false;
    if(syncAgain){ syncAgain = false; kick(200); }
  }
}
async function applyRemote(col, r){
  const key = col + "/" + r.id;
  if(await idbGet("outbox", key)) return; // eigene, noch nicht hochgeladene Änderung hat Vorrang
  await idbPut("docs", key, { col, id: r.id, data: r.data, deleted: !!r.deleted, updated_at: r.updated_at });
  if(col === "areas" && r.id === "__people"){ S.peopleList = !r.deleted && Array.isArray(r.data.names) ? r.data.names : []; if(!document.querySelector(".sheet, #anno, #viewer")) scheduleRender(); return; }
  const i = S[col].findIndex(x => x.id === r.id);
  if(r.deleted){ if(i >= 0) S[col].splice(i, 1); }
  else { const o = { id: r.id, ...r.data }; if(i >= 0) S[col][i] = o; else S[col].push(o); }
  if(col === "meetings") sortMeetings();
  if(!document.querySelector(".sheet, #anno, #viewer")) scheduleRender();
}
function subscribeLive(){
  const ch = sb.channel("werkbuch-" + S.user.id);
  for(const col of COLS) ch.on("postgres_changes", { event: "*", schema: "public", table: col }, p => { if(p.new && p.new.id) applyRemote(col, p.new); });
  ch.subscribe();
}

function viewJetzt(){
  const pinned = t => prio(t) === 1 && !t.rec && !isVisibleNow(t); // hohe Priorität: immer sichtbar, auch ohne nahes Datum
  const all = openTasks().filter(t => isVisibleNow(t) || pinned(t));
  const nHigh = all.filter(t => prio(t) === 1).length;
  const focus = nHigh >= FOCUS_LIMIT && !S.showLow;
  const lowHidden = all.filter(t => prio(t) === 3);
  const vis = (focus ? all.filter(t => prio(t) !== 3) : all).sort(byPrio);
  const near = vis.filter(t => !pinned(t));
  const late = near.filter(t => daysUntil(t.due) < 0);
  const tod = near.filter(t => daysUntil(t.due) === 0);
  const soon = near.filter(t => daysUntil(t.due) > 0);
  const later = vis.filter(pinned);
  const inbox = openTasks().filter(t => !t.area);
  const d = new Date();
  const head = `<h1>${["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][d.getDay()]}, ${d.getDate()}. ${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][d.getMonth()]}</h1>

      <span class="pill">${soon.length} in den nächsten Tagen</span>

      ${openTasks().some(t => t.status === "arbeit") ? `<button class="pill wip" data-act="wipl">${openTasks().filter(t => t.status === "arbeit").length} in Arbeit</button>` : ""}
      ${MS.tok && calOfDay(today()).filter(e => !e.allDay && e.end.slice(11, 16) > new Date().toTimeString().slice(0, 5)).length ? `<button class="pill" data-tab="tag">${I.cal.replace("<svg", '<svg width="13" height="13" style="vertical-align:-2px"')} ${calOfDay(today()).filter(e => !e.allDay && e.end.slice(11, 16) > new Date().toTimeString().slice(0, 5)).length} Termine heute</button>` : ""}
    </div>
    ${focus && lowHidden.length ? `<div class="hidden-note"><span>Fokus: ${nHigh} Aufgaben mit hoher Priorität, darum ${lowHidden.length} mit niedriger ausgeblendet.</span><button class="btn ghost" data-act="showlow">Trotzdem anzeigen</button></div>` : ""}
    ${S.showLow && nHigh >= FOCUS_LIMIT && lowHidden.length ? `<div class="hidden-note"><span>Niedrige Prioritäten werden angezeigt.</span><button class="btn ghost" data-act="showlow">Wieder ausblenden</button></div>` : ""}`;
  const inboxBtn = inbox.length ? `<button class="inbox" data-act="area" data-id="__inbox"><span><b>Eingang</b><br><span class="sub">${inbox.length} ${inbox.length === 1 ? "Aufgabe" : "Aufgaben"} ohne Bereich, noch einordnen</span></span><span aria-hidden="true">›</span></button>` : "";
  const body = vis.length ? section("Überfällig", late) + section("Heute", tod) + section("Nächste Tage", soon) + section("Wichtig, ohne nahen Termin", later)
    : (S.tasks.length ? `<div class="empty" style="margin-top:18px">Nichts Dringendes. Alles andere wartet in den Bereichen.</div>`
                      : `<div class="empty" style="margin-top:18px">Noch keine Aufgaben. Tippe auf <b>+</b>, um die erste zu erfassen.${!S.areas.length ? ` Unter <b>Bereiche</b> legst du zuerst deine Baustellen und Aufgabenbereiche an.` : ""}</div>`);
  return head + inboxBtn + body;
}

/* ---------- Tagesplan ---------- */
const byPlan = (a,b) => (a.planTime || "99:99").localeCompare(b.planTime || "99:99") || (a.planOrder ?? 0) - (b.planOrder ?? 0);
function planOf(day){ return S.tasks.filter(t => t.plan === day).sort(byPlan); }
function viewTag(){
  const day = S.day || today();
  const items = planOf(day);
  const open = items.filter(t => !t.done), done = items.filter(t => t.done);
  const isToday = day === today();
  const yest = addDays(today(), -1);
  const left = isToday ? S.tasks.filter(t => !t.done && t.plan && t.plan < today()) : [];
  const planned = new Set(items.map(t => t.id));
  const sugg = openTasks().filter(t => !planned.has(t.id) && (isVisibleNow(t) || (prio(t) === 1 && !t.rec))).sort(byPrio).slice(0, 12);
  const d = parse(day);
  const title = isToday ? "Heute" : day === addDays(today(), 1) ? "Morgen" : fmt(day);
  const ms = !!MS.tok, cal = ms ? calOfDay(day) : [];
  const row = (t, i) => `<div class="plan">
      <input class="time" type="text" inputmode="numeric" maxlength="11" placeholder="0800" value="${esc(t.planTime || "")}" data-act="ptime" data-id="${t.id}" aria-label="Uhrzeit für ${esc(t.title)}">
      ${taskRow(t, { inPlan: true })}
      <div class="mv"><button data-act="pup" data-id="${t.id}" aria-label="Nach oben" ${i === 0 ? "disabled" : ""}>▲</button><button data-act="pout" data-id="${t.id}" aria-label="Aus Tagesplan entfernen">✕</button>${t.planTime && !t.done ? (ms ? (t.ol && t.ol.id ? `<span class="olk ok" title="Steht im Outlook-Kalender">${I.cal}</span>` : `<span class="olk wait" title="Wird in Outlook eingetragen">…</span>`) : `<a class="olk" href="${outlookLink(t, day)}" target="_blank" rel="noopener" aria-label="In Outlook eintragen" title="In Outlook eintragen">OL</a>`) : ""}</div>
    </div>`;
  const calRow = e => `<div class="plan calrow">
      <span class="time ro mono">${e.allDay ? "ganzer Tag" : e.start.slice(11, 16)}</span>
      <div class="task calev"><div class="body"><div class="t">${esc(e.subject)}</div><div class="meta">${e.allDay ? "" : `<span class="mono">${e.start.slice(11, 16)}–${e.end.slice(11, 16)}</span>`}${e.loc ? `<span>${esc(e.loc)}</span>` : ""}<span class="olbadge">${I.cal} Outlook</span></div></div></div>
      <span></span></div>`;
  const merged = [...open.map((t, i) => ({ k: t.planTime || "99:99", h: row(t, i) })), ...cal.map(e => ({ k: e.allDay ? "00:00" : e.start.slice(11, 16), h: calRow(e) }))]
    .sort((a, b) => a.k.localeCompare(b.k));
  const cfgMs = !!msCfg();
  const msBar = !cfgMs ? "" : !ms ? `<div class="hidden-note"><span>Outlook-Termine hier sehen und Einträge mit Uhrzeit automatisch in den Kalender übernehmen.</span><button class="btn pri" data-act="msconnect">Outlook verbinden</button></div>`
    : MS.need ? `<div class="hidden-note"><span>Die Outlook-Verbindung ist abgelaufen.</span><button class="btn pri" data-act="msconnect">Erneuern</button></div>`
    : MS.err ? `<div class="hidden-note" style="color:var(--late)"><span>Outlook: ${esc(MS.err)}</span><button class="btn ghost" data-act="msretry">Nochmals</button></div>` : "";
  return `<h1>Tagesplan ${esc(title)}</h1>
    <div class="daynav">
      <button class="chip" data-act="day" data-id="${addDays(day, -1)}">‹ ${fmt(addDays(day, -1))}</button>
      ${isToday ? "" : `<button class="chip" data-act="day" data-id="${today()}">Heute</button>`}
      <button class="chip" data-act="day" data-id="${addDays(day, 1)}">${fmt(addDays(day, 1))} ›</button>
      <span class="sub mono">${open.length} offen · ${done.length} erledigt${ms ? ` · ${cal.length} Outlook` : ""}</span>
    </div>
    ${msBar}
    ${left.length ? `<div class="hidden-note"><span>${left.length} ${left.length === 1 ? "geplante Aufgabe ist" : "geplante Aufgaben sind"} von früheren Tagen liegen geblieben.</span><button class="btn ghost" data-act="carry">Auf heute übernehmen</button></div>` : ""}
    ${merged.length ? `<div class="list" style="margin-top:12px">${merged.map(x => x.h).join("")}</div>` : `<div class="empty" style="margin-top:12px">Noch nichts geplant. Wähle unten Vorschläge aus oder schreib einen Termin dazu.</div>`}
    <div class="addrow"><input type="text" id="padd" placeholder="Eintrag für ${esc(title.toLowerCase() === "heute" ? "heute" : fmt(day))}, z. B. 1000-1130 Baustellenbesuch" aria-label="Eintrag zum Tagesplan hinzufügen"><button class="btn pri" data-act="padd">Hinzufügen</button></div>
    ${done.length ? `<h2>Erledigt <span class="n">${done.length}</span></h2><div class="list">${done.map(t => taskRow(t, { inPlan: true })).join("")}</div>` : ""}
    ${sugg.length ? `<h2>Vorschläge aus „Jetzt“ <span class="n">${sugg.length}</span></h2><div class="list">${sugg.map(t => `<div class="plan" style="grid-template-columns:1fr auto">${taskRow(t)}<button class="sugbtn" data-act="pin" data-id="${t.id}">+ Plan</button></div>`).join("")}</div>` : ""}`;
}
function outlookLink(t, day){
  const end = evEnd(t);
  const body = (areaById(t.area)?.name || "") + (t.who ? "\nDelegiert an: " + t.who : "") + (t.note ? "\n\n" + t.note : "");
  return `https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(t.title)}&startdt=${day}T${t.planTime}:00&enddt=${day}T${end}:00&body=${encodeURIComponent(body)}&path=%2Fcalendar%2Faction%2Fcompose`;
}
async function addToPlan(id, day){
  const t = S.tasks.find(x => x.id === id); if(!t) return;
  const n = planOf(day).length;
  await putTask({ ...t, plan: day, planOrder: n });
}

function areaCounts(id){
  const ts = openTasks().filter(t => (t.area || "__inbox") === id);
  const late = ts.filter(t => t.due && daysUntil(t.due) < 0 && isVisibleNow(t)).length;
  const soon = ts.filter(t => isVisibleNow(t) && daysUntil(t.due) >= 0).length;
  const hidden = ts.filter(isHiddenRec).length;
  const high = ts.filter(t => prio(t) === 1 && !isHiddenRec(t)).length;
  return { total: ts.length - hidden, late, soon, hidden, high };
}
function viewBereiche(){
  if(S.area) return viewArea(S.area);
  const order = ["baustelle","produktion","intern","lehrlinge","sicherheit"];
  const act = S.areas.filter(a => !a.archived).sort((a,b) => (order.indexOf(a.kind) - order.indexOf(b.kind)) || (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));
  const arch = S.areas.filter(a => a.archived);
  const tile = a => { const c = areaCounts(a.id); return `<button class="tile" style="--ac:${a.color}" data-act="area" data-id="${a.id}">
      <span class="kind">${esc(KIND[a.kind] || a.kind)}</span><span class="name">${esc(a.name)}</span>
      <span class="counts">${c.late ? `<span class="late">${c.late} überfällig</span>` : ""}${c.soon ? `<span class="soon">${c.soon} bald</span>` : ""}${c.high ? `<span class="late">${c.high} hoch</span>` : ""}${!c.late && !c.soon && !c.high ? `<span class="calm">ruhig</span>` : ""}<span>${c.total} offen</span>${c.hidden ? `<span>${c.hidden} geplant</span>` : ""}</span>
    </button>`; };
  const ib = areaCounts("__inbox");

    <div class="tiles" style="margin-top:12px">
      ${ib.total ? `<button class="tile" style="--ac:var(--muted)" data-act="area" data-id="__inbox"><span class="kind">Unsortiert</span><span class="name">Eingang</span><span class="counts"><span>${ib.total} offen</span></span></button>` : ""}
      ${act.map(tile).join("")}
    </div>
    ${!S.areas.length ? `<div class="empty" style="margin-top:4px">Noch keine Bereiche. Lege deine Baustellen und Aufgabenbereiche an, oder starte mit den Grundbereichen.</div>` : ""}
    <div class="row" style="margin-top:14px"><button class="btn" data-act="newarea">Bereich hinzufügen</button>${!S.areas.length ? `<button class="btn pri" data-act="starter">Grundbereiche anlegen</button>` : ""}</div>
    ${arch.length ? `<details class="fold"><summary>Archiv (${arch.length})</summary><div class="tiles" style="margin-top:8px">${arch.map(tile).join("")}</div></details>` : ""}`;
}
function viewArea(id){
  const a = id === "__inbox" ? { id, name: "Eingang", kind: "eingang", color: "var(--muted)" } : areaById(id);

  const planned = mine.filter(isHiddenRec).sort(byDue);

    ${open.length ? section("Offen", open, { hideArea: true }) : `<div class="empty" style="margin-top:16px">Keine offenen Aufgaben.</div>`}
    ${planned.length ? `<details class="fold"><summary>Geplant, noch verborgen (${planned.length})</summary><p class="sub">Wiederkehrende Aufgaben, die erst kurz vor der Fälligkeit in „Jetzt“ erscheinen.</p><div class="list">${planned.map(t => taskRow(t, { hideArea: true })).join("")}</div></details>` : ""}
    ${done.length ? `<details class="fold"><summary>Erledigt (${done.length})</summary><div class="list">${done.map(t => taskRow(t, { hideArea: true })).join("")}</div></details>` : ""}`;
}

function viewListe(){
  const areas = S.areas.filter(a => !a.archived);
  let ts = openTasks().filter(t => !isHiddenRec(t));
  if(S.listArea !== "alle") ts = ts.filter(t => (t.area || "__inbox") === S.listArea);
  const ppl = people().map(p => ({ ...p, n: personTasks(p.name).length })).filter(p => p.n || p.saved);
  const W = S.listWho || "alle";
  if(W === "__me") ts = ts.filter(t => !t.who);
  else if(W === "__del") ts = ts.filter(t => t.who);

  else if(W !== "alle") ts = ts.filter(t => mentions(t, W));
  if(S.q) ts = ts.filter(t => (t.title + " " + (t.note || "") + " " + (t.who || "")).toLowerCase().includes(S.q.toLowerCase()));

function render(){
  const v = $("#view");
  const qFocus = document.activeElement && document.activeElement.id === "q";

  v.innerHTML = S.tab === "jetzt" ? viewJetzt() : S.tab === "tag" ? viewTag() : S.tab === "bereiche" ? viewBereiche() : S.tab === "liste" ? viewListe() : viewMeeting();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  if($("#padd") && paddVal && !$("#padd").value) $("#padd").value = paddVal;

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, restore){
  undo = restore || null;
  const old = $(".toast"); if(old) old.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status");
  el.innerHTML = `<span>${esc(msg)}</span>${restore ? `<button data-act="undo">Rückgängig</button>` : ""}`;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 5000);
}

async function attachFiles(taskId, files){

    const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
    const att = { kind: isPdf ? "pdf" : "img", name: f.name, pins: [], strokes: [] };
    try {
      if(isPdf){
        let png = null; try { png = await pdfFirstPage(f); } catch(e){}
        att.file = await storeBlob(f.type ? f : new Blob([f], { type: "application/pdf" }), "pdf");
        if(png) att.preview = await storeBlob(png, "png");
      } else {
        const small = await shrink(f, 2000);
        att.file = await storeBlob(small, /png$/i.test(small.type) ? "png" : "jpg");
      }
    } catch(e){ toast("Datei konnte nicht gespeichert werden: " + f.name); continue; }
    const t = S.tasks.find(x => x.id === taskId); if(!t) return;
    await putTask({ ...t, att: [...(t.att || []), att] });
  }

const toDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function shrink(file, max){
  try {
    const img = await loadImg(URL.createObjectURL(file));
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    if(s === 1 && file.size < 2.5e6) return file;
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", .85));
  } catch(e){ return file; }
}
let pdfReady = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function pdfFirstPage(file){
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfReady = pdfReady || (async () => { await loadScript(base + "pdf.min.js"); await loadScript(base + "pdf.worker.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; })();
  await pdfReady;
  const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const page = await doc.getPage(1);
  const vp0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.min(3, 1800 / Math.max(vp0.width, vp0.height)) });
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return await new Promise(r => c.toBlob(r, "image/png"));
}

let AN = null;
async function openAnno(taskId, i){
  const t = S.tasks.find(x => x.id === taskId); const a = t && t.att[i]; if(!a) return;
  const basePath = a.preview || a.file;

  el.innerHTML = `<div class="bar">

      <button class="btn" data-am="undo">Rückgängig</button>

    <div class="stage"><canvas id="cv"></canvas></div>`;
  document.body.appendChild(el);
  const cv = $("#cv"); const s = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
  cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
  drawAnno();
  const pt = e => { const r = cv.getBoundingClientRect(); return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]; };

    if(AN.mode !== "pin"){ if(AN.editPin >= 0) pinOk(); AN.cur = { t: AN.mode, c: AN.colors[AN.mode], p: [pt(e)] }; AN.strokes.push(AN.cur); AN.hist.push("s"); }
    else AN.down = pt(e);

const PEN_COLORS = [["#E1251B","Rot"],["#1F5FBF","Blau"],["#1E9E4A","Grün"],["#111111","Schwarz"],["#F28C00","Orange"],["#FFD400","Gelb"],["#FF4FA3","Pink"]];
function loadPenColors(){ const d = { pen: "#E1251B", filz: "#1F5FBF", marker: "#FFD400" }; try { return { ...d, ...JSON.parse(localStorage.getItem("penColors") || "{}") }; } catch(e){ return d; } }
function savePenColors(c){ try { localStorage.setItem("penColors", JSON.stringify(c)); } catch(e){} }
function markSwatch(){ if(!AN) return; document.querySelectorAll(".sw").forEach(x => x.setAttribute("aria-pressed", x.dataset.c === AN.colors[AN.mode])); }
function simplify(p){ const out = [p[0]]; for(let k = 1; k < p.length; k++){ const l = out[out.length - 1]; if(Math.hypot(p[k][0] - l[0], p[k][1] - l[1]) > .003) out.push(p[k]); } return out; }
function drawAnno(target){
  const cv = target || $("#cv"); const ctx = cv.getContext("2d"); const W = cv.width, H = cv.height;

  for(const raw of AN.strokes){
    const s = Array.isArray(raw) ? { t: "pen", c: "#E1251B", p: raw } : raw; // ältere Striche ohne Farbe: roter Stift
    if(!s.p || s.p.length < 1) continue;

    ctx.fillStyle = "#E1251B"; ctx.beginPath(); ctx.arc(x, y - R, R, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - R * .6, y - R * .5); ctx.lineTo(x, y); ctx.lineTo(x + R * .6, y - R * .5); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `700 ${R}px Archivo, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(k + 1), x, y - R);
    if(p.text) drawPinLabel(ctx, p.text, x, y - R, R, W, H);
  });
}
function drawPinLabel(ctx, text, px, py, R, W, H){
  const fs = Math.max(11, Math.round(R * .8)), lh = fs * 1.25, padX = fs * .5, padY = fs * .4, maxW = Math.max(fs * 8, W * .32);
  ctx.save(); ctx.font = `600 ${fs}px "Atkinson Hyperlegible", sans-serif`; ctx.textAlign = "left"; ctx.textBaseline = "top";
  const lines = []; let line = "";
  for(const word of String(text).split(/\s+/)){
    const test = line ? line + " " + word : word;
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = word; } else line = test;
  }
  if(line) lines.push(line);
  const shown = lines.slice(0, 6); if(lines.length > 6) shown[5] += " …";
  const bw = Math.min(maxW, Math.max(...shown.map(l => ctx.measureText(l).width))) + padX * 2, bh = shown.length * lh + padY * 2;
  let bx = px + R * 1.3, by = py - bh / 2;
  if(bx + bw > W - 4) bx = px - R * 1.3 - bw;
  bx = Math.max(4, Math.min(W - bw - 4, bx)); by = Math.max(4, Math.min(H - bh - 4, by));
  ctx.fillStyle = "rgba(255,255,255,.94)"; ctx.strokeStyle = "#E1251B"; ctx.lineWidth = Math.max(2, R / 7);
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, fs * .3); else ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#17211D"; shown.forEach((l, k) => ctx.fillText(l, bx + padX, by + padY + k * lh));
  ctx.restore();
}

let sumCtl = null;
async function summarize(){
  meetDraft.title = $("#mt").value; meetDraft.area = $("#ma").value; meetDraft.notes = $("#mn").value;
  if(!meetDraft.notes.trim()){ $("#mn").focus(); return; }
  meetDraft.busy = true; meetDraft.err = ""; meetDraft.result = null; render();
  sumCtl = new AbortController();
  const areaNames = S.areas.filter(a => !a.archived).map(a => a.name);
  const main = areaById(meetDraft.area);
  const prompt = `Du hilfst einem Holzbau-Fachmann (Produktion, Baustellen, Lehrlingsausbildung, Sicherheitsbeauftragter) in der Schweiz. Heute ist ${today()} (${fmt(today())}).
Fasse die folgenden Meeting-Notizen zusammen und finde alle Aufgaben darin. Schreibe Schweizer Hochdeutsch (ss statt ß), kurz und sachlich.
Bereiche: ${areaNames.join(", ")}.${main ? ` Hauptbereich dieses Meetings: ${main.name}.` : ""}
Antworte NUR mit JSON in genau dieser Form:
{"zusammenfassung":["Punkt", "..."],"aufgaben":[{"titel":"kurze Aufgabe mit Verb","prio":1|2|3 (1=hoch, 2=normal, 3=niedrig),"bereich":"exakter Bereichsname aus der Liste oder leer","faellig":"YYYY-MM-DD oder null","wer":"Vorname der Person, die es erledigt, oder leer wenn ich selbst"}]}
Höchstens 7 Zusammenfassungspunkte. Relative Fristen (z. B. "bis Freitag") in ein Datum umrechnen.

Titel: ${meetDraft.title || "-"}
Notizen:
${meetDraft.notes.slice(0, 20000)}`;
  try {
    if(!navigator.onLine) throw { code: "offline" };
    const { data, error } = await sb.functions.invoke("meeting", { body: { prompt } });
    if(error){ const st = error.context && error.context.status; throw { code: st === 501 || st === 404 ? "not_setup" : st === 401 ? "auth" : "upstream" }; }
    if(sumCtl.signal.aborted) throw { code: "cancelled" };
    const r = parseJSONLoose(data && data.text);
    const aufgaben = Array.isArray(r?.aufgaben) ? r.aufgaben : [];
    aufgaben.forEach(t => { const a = S.areas.find(x => x.name.toLowerCase() === String(t.bereich || "").toLowerCase()); t._area = a ? a.id : (meetDraft.area || ""); if(t.faellig === "null") t.faellig = null; });
    meetDraft.result = { zusammenfassung: Array.isArray(r?.zusammenfassung) ? r.zusammenfassung.map(String) : [], aufgaben };
  } catch(e){
    const msg = { cancelled: "", offline: "Ohne Internet geht die Zusammenfassung nicht. Die Notizen bleiben stehen.", not_setup: "Die Zusammenfassung mit Claude ist noch nicht eingerichtet. Die Notizen kannst du trotzdem speichern.", auth: "Bitte neu anmelden.", invalid_json: "Die Antwort war unvollständig. Bitte nochmals versuchen." };
    if(e && e.code === "not_setup") S.aiMissing = true;
    meetDraft.err = msg[e?.code] ?? "Das hat nicht geklappt. Bitte nochmals versuchen.";
  }
  meetDraft.busy = false; render();
}
function parseJSONLoose(t){
  t = String(t || "");
  try { return JSON.parse(t); } catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f) try { return JSON.parse(f[1]); } catch(e){}
  const a = t.indexOf("{"), b = t.lastIndexOf("}"); if(a >= 0 && b > a) try { return JSON.parse(t.slice(a, b + 1)); } catch(e){}
  throw { code: "invalid_json" };
}
async function saveMeeting(){
  if(!meetDraft.result){ // ohne Zusammenfassung: nur Notizen speichern
    meetDraft.title = $("#mt").value; meetDraft.area = $("#ma").value; meetDraft.notes = $("#mn").value;
    if(!meetDraft.notes.trim()){ $("#mn").focus(); return; }
    await putMeeting({ id: uid(), title: meetDraft.title || "Meeting", date: today(), created: new Date().toISOString(), area: meetDraft.area || null, notes: meetDraft.notes, summary: [], tasks: [] });
    meetDraft = { title: "", area: "", notes: "", result: null, busy: false, err: "" };
    render(); toast("Meeting-Notizen gespeichert."); return;
  }
  const r = meetDraft.result; if(!r) return;
  const created = [];
  for(const t of r.aufgaben){
    if(t._skip || !t.titel) continue;
    const task = { id: uid(), title: String(t.titel), who: canonWho(t.wer), prio: [1,2,3].includes(+t.prio) ? +t.prio : 2, area: t._area || null, due: /^\d{4}-\d{2}-\d{2}$/.test(t.faellig || "") ? t.faellig : null, rec: null, note: `Aus Meeting: ${meetDraft.title || fmt(today())}`, att: [], done: false, created: today() };
    created.push(task.id); await putTask(task);
  }
  await putMeeting({ id: uid(), title: meetDraft.title || "Meeting", date: today(), created: new Date().toISOString(), area: meetDraft.area || null, notes: meetDraft.notes, summary: r.zusammenfassung, tasks: created });
  meetDraft = { title: "", area: "", notes: "", result: null, busy: false, err: "" };
  render(); toast(`${created.length} ${created.length === 1 ? "Aufgabe" : "Aufgaben"} übernommen.`);
}

  const cfg = window.WERKBUCH_CONFIG || {};
  if(window.supabase && cfg.url && cfg.key){
    sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  }
  // Login-Formular
  $("#loginform").addEventListener("submit", async e => {
    e.preventDefault();
    if(!sb){ $("#lerr").textContent = "Keine Verbindung zum Server. Bitte Internet prüfen."; return; }
    const email = $("#lemail").value.trim(), password = $("#lpw").value;
    $("#lbtn").disabled = true; $("#lerr").textContent = "";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    $("#lbtn").disabled = false;
    if(error){ $("#lerr").textContent = /invalid/i.test(error.message) ? "E-Mail oder Passwort stimmt nicht." : /confirm/i.test(error.message) ? "Die E-Mail-Adresse ist noch nicht bestätigt." : "Anmelden ging nicht: " + error.message; return; }
    startSession(data.user);
  });
  $("#lsignup").addEventListener("click", async () => {
    if(!sb){ $("#lerr").textContent = "Keine Verbindung zum Server."; return; }
    const email = $("#lemail").value.trim(), password = $("#lpw").value;
    if(!email || password.length < 6){ $("#lerr").textContent = "Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben."; return; }
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ $("#lerr").textContent = "Konto erstellen ging nicht: " + error.message; return; }
    if(data.session) startSession(data.user);
    else $("#lerr").textContent = "Konto erstellt. Bitte zuerst den Link in der Bestätigungs-E-Mail öffnen, dann anmelden.";
  });
  window.addEventListener("online", () => { kick(0); msKick(0); });
  window.addEventListener("offline", () => setStatus("offline"));
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ kick(0); msKick(500); } });
  setInterval(() => kick(0), 120000);
  setInterval(() => msKick(0), 300000);

  // Sitzung: online über Supabase, offline aus dem Gerätespeicher
  if(sb){
    const { data } = await sb.auth.getSession();
    if(data && data.session){ await startSession(data.session.user); }
    else showLogin();
    sb.auth.onAuthStateChange((ev, session) => { if(ev === "SIGNED_OUT" && S.user) location.reload(); });
  } else {
    const uidLocal = await idbGet("meta", "uid").catch(() => null);
    if(uidLocal){ S.user = { id: uidLocal, email: await idbGet("meta", "email") }; await loadLocal(); render(); setStatus("offline"); }
    else showLogin("Für die erste Anmeldung braucht es Internet.");
  }
}
boot();
})();
</script>
</body>
</html>
